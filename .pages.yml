# Pages CMS configuration. Authentication and write access are enforced by GitHub / Pages CMS.
media:
  - name: assets
    label: 图片与附件
    input: content/assets
    output: /assets
    categories:
      - image
      - document
      - audio
      - video
      - compressed
    rename: safe
content:
  - name: notes
    label: 知识笔记（推荐在此新建）
    type: collection
    path: content/notes
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{primary}.md"
      field: create
    view:
      layout: tree
      primary: title
      fields:
        - title
        - draft
      search:
        - title
        - description
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 内容简介（可选）
        type: text
      - name: tags
        label: 标签（可选）
        type: string
        list: true
      - name: draft
        label: 暂不生成网页（原文仍在公开仓库）
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: assets
  - name: nisp_legacy
    label: 原有 NISP（二级）笔记
    type: collection
    path: content/NISP（二级）
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{primary}.md"
      field: create
    view:
      layout: tree
      primary: title
      fields:
        - title
        - draft
      search:
        - title
        - description
    operations:
      create: true
      rename: true
      delete: true
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 内容简介（可选）
        type: text
      - name: tags
        label: 标签（可选）
        type: string
        list: true
      - name: draft
        label: 暂不生成网页（原文仍在公开仓库）
        type: boolean
        default: false
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: assets
  - name: about
    label: 关于我
    type: file
    path: content/about.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 内容简介（可选）
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: assets
  - name: projects
    label: 作品与实践
    type: file
    path: content/projects.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 内容简介（可选）
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: assets
  - name: now
    label: 此刻 / 近况
    type: file
    path: content/now.md
    format: yaml-frontmatter
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: description
        label: 内容简介（可选）
        type: text
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
          switcher: true
          media: assets
  - name: home
    label: 首页（含排版代码，请谨慎修改）
    type: file
    path: content/index.md
    format: code
    operations:
      create: false
      rename: false
      delete: false
settings:
  content:
    merge: true
  commit:
    templates:
      create: 新增内容：{path}
      update: 更新内容：{path}
      delete: 删除内容：{path}
      rename: 重命名：{oldPath} -> {newPath}
